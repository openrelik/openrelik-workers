name: Update Worker Test Coverage

on:
  push:
    branches:
      - main
    paths:
      - "workers/**"
      - "scripts/update_coverage.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Run coverage script
        run: python scripts/update_coverage.py

      - name: Commit changes to README.md
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update worker test coverage in README"
          file_pattern: "README.md"
