[project]
name = "openrelik-worker-export-s3"
version = "0.1.0"
description = "Export input files to Amazon S3 with optional compression"
authors = [{ name = "OpenRelik Authors" }]
requires-python = ">=3.12,<4"
readme = "README.md"
dependencies = [
    "celery[redis]>=5.4.0,<6",
    "openrelik-worker-common>=0.17",
    "boto3>=1.34,<2",
    "debugpy>=1.8.7,<2",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-cov>=5.0.0,<6",
    "moto[s3]>=5",
]

[tool.uv]
package = false
default-groups = ["test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
