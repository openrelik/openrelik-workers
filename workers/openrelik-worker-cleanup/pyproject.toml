[project]
name = "openrelik-worker-cleanup"
version = "0.1.0"
description = "Delete intermediate (register_in_db=False) workflow artifacts from disk as a chord callback"
authors = [{ name = "OpenRelik Authors" }]
requires-python = ">=3.12,<4"
readme = "README.md"
dependencies = [
    "celery[redis]>=5.4.0,<6",
    "openrelik-worker-common>=0.17",
    "debugpy>=1.8.7,<2",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-cov>=5.0.0,<6",
]

[tool.uv]
package = false
default-groups = ["test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
