[project]
name = "openrelik-worker-export-splunk"
version = "0.1.0"
description = "Export JSONL events to Splunk Cloud via HEC"
authors = [{ name = "OpenRelik Authors" }]
requires-python = ">=3.12,<4"
readme = "README.md"
dependencies = [
    "celery[redis]>=5.4.0,<6",
    "openrelik-worker-common>=0.17",
    "aiohttp>=3.14.1",
    "aiofiles>=24.0",
    "debugpy>=1.8.7,<2",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0.0,<6",
]

[tool.uv]
package = false
default-groups = ["test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
